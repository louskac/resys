<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Vibrant brand gradient -->
    <linearGradient id="resysGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" /> <!-- Violet -->
      <stop offset="50%" stop-color="#6366F1" /> <!-- Indigo -->
      <stop offset="100%" stop-color="#14B8A6" /> <!-- Teal -->
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="subtleGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#subtleGlow)">
    <!-- Stylized Modern Geometric Letter 'R' -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="
      M 110 150 
      L 155 105 
      H 315 
      C 385 105 405 145 405 205 
      C 405 255 380 285 325 295 
      L 385 395 
      H 320 
      L 265 305 
      H 175 
      V 395 
      H 120 
      V 170 
      L 110 150 
      Z 
      M 175 160 
      V 255 
      H 275 
      C 325 255 345 235 345 205 
      C 345 175 325 160 275 160 
      H 175 
      Z" 
      fill="url(#resysGradient)" 
    />

    <!-- Glowing Calendar/Schedule Grid on the diagonal leg of 'R' -->
    <g fill="#FFFFFF" opacity="0.85">
      <rect x="290" y="325" width="10" height="10" rx="2.5" />
      <rect x="312" y="325" width="10" height="10" rx="2.5" />
      <rect x="334" y="325" width="10" height="10" rx="2.5" />
      <rect x="356" y="325" width="10" height="10" rx="2.5" />

      <rect x="301" y="345" width="10" height="10" rx="2.5" />
      <rect x="323" y="345" width="10" height="10" rx="2.5" />
      <rect x="345" y="345" width="10" height="10" rx="2.5" />
      <rect x="367" y="345" width="10" height="10" rx="2.5" />

      <rect x="312" y="365" width="10" height="10" rx="2.5" />
      <rect x="334" y="365" width="10" height="10" rx="2.5" />
      <rect x="356" y="365" width="10" height="10" rx="2.5" />
      <rect x="378" y="365" width="10" height="10" rx="2.5" />
    </g>
  </g>
</svg>
